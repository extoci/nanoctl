name: Install Linux media dependencies
description: >-
  Installs the apt packages nanoctl-agent's media feature needs on Linux.
  Downloaded .deb archives are kept in a monthly-rotated GitHub cache that is
  bind-mounted over /var/cache/apt/archives, so apt mirror stalls cannot stretch
  installs from ~15s to 5+ minutes. The install itself still goes through
  apt-get, so package resolution and post-install hooks are unchanged.
inputs:
  extra-packages:
    description: Additional apt packages on top of the shared media set
    required: false
    default: ""
  cache-suffix:
    description: Discriminator for this package set's cache entry
    required: true
  save-cache:
    description: Save downloaded archives back to the cache (false on pull_request runs)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - id: month
      shell: bash
      run: echo "ym=$(date -u +%Y-%m)" >>"$GITHUB_OUTPUT"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/apt-archives
        key: apt-${{ inputs.cache-suffix }}-${{ steps.month.outputs.ym }}
        # Second entry lets a leg with extra packages fall back to a sibling
        # package set's archives (e.g. x264 legs restore the plain media entry
        # and download only libx264-dev) on a cold-month cache.
        restore-keys: |
          apt-${{ inputs.cache-suffix }}-
          apt-
    - name: Install apt packages
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/apt-archives/partial"
        sudo mount --bind "$HOME/apt-archives" /var/cache/apt/archives
        sudo apt-get update -o Acquire::Retries=10
        sudo apt-get install -y -o Acquire::Retries=10 \
          clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev \
          libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev \
          libffmpeg-nvenc-dev libva-dev libxinerama-dev libxrandr-dev \
          libxtst-dev cmake nasm pkg-config ${{ inputs.extra-packages }}
      # The bind-mounted /var/cache/apt/archives holds root-owned files
      # (apt's lock, partial/) that the runner cannot read; tar exits 2
      # without this.
    - name: Make archives readable for cache save
      if: inputs.save-cache == 'true'
      shell: bash
      run: sudo chmod -R a+rX "$HOME/apt-archives"
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.save-cache == 'true'
      with:
        path: ~/apt-archives
        key: apt-${{ inputs.cache-suffix }}-${{ steps.month.outputs.ym }}
