name: ci

on:
  pull_request:
  push:
    branches: [master, "rewrite/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_APP_ORIGIN: https://nanoctl.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser
      - run: bun run test:turn
      - run: bun run audit
      - run: bun run build:vercel

  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path crates/nanoctl-agent/Cargo.toml -- --check
      - run: cargo clippy --all-targets --features rtc --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings
      - run: cargo test --features rtc --manifest-path crates/nanoctl-agent/Cargo.toml
      - name: Validate POSIX package scripts
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n install.sh packaging/linux/*.sh packaging/macos/*.sh
      - name: Lint POSIX package scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh packaging/linux/*.sh packaging/macos/*.sh
      - name: Validate PowerShell package scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          @(Get-Item install.ps1) + @(Get-ChildItem packaging/windows -Filter *.ps1) | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

  agent-media-linux:
    # Master pushes produce the exact release matrix below. Keep the faster media check for pull
    # requests and non-release branches, but do not compile the same master commit twice.
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: clippy
      - run: bun install --frozen-lockfile
      - name: Install native capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev \
            libva-dev libxinerama-dev libxrandr-dev libxtst-dev \
            nasm pkg-config
      - run: cargo clippy --all-targets --features media --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings
      - run: cargo test --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - run: cargo build --release --features media --manifest-path crates/nanoctl-agent/Cargo.toml

  agent-media-native:
    # Master pushes produce the exact release matrix below. Keep the faster media check for pull
    # requests and non-release branches, but do not compile the same master commit twice.
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: clippy
      - run: bun install --frozen-lockfile
      - run: cargo clippy --all-targets --features media --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings
      - run: cargo test --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - run: cargo build --release --features media --manifest-path crates/nanoctl-agent/Cargo.toml

  release-candidate:
    # This is the single artifact-producing build for a master commit. The tag workflow promotes
    # these immutable artifacts instead of compiling the same commit on a second set of runners.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
            binary: nanoctl
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            binary: nanoctl
          - runner: macos-15-intel
            platform: macos
            architecture: x64
            binary: nanoctl
          - runner: macos-15
            platform: macos
            architecture: arm64
            binary: nanoctl
          - runner: windows-2025
            platform: windows
            architecture: x64
            binary: nanoctl.exe
          - runner: windows-11-arm
            platform: windows
            architecture: arm64
            binary: nanoctl.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: clippy
      - name: Install Linux media dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev \
            libva-dev libxinerama-dev libxrandr-dev libxtst-dev nasm pkg-config
      - run: cargo clippy --all-targets --features media --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings
      - run: cargo test --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - run: cargo build --release --locked --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - name: Stage Unix release asset
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          asset="nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}"
          install -m 0755 "crates/nanoctl-agent/target/release/${{ matrix.binary }}" "$asset"
          "./$asset" --version
          sha256sum "$asset" >"$asset.sha256"
      - name: Stage Windows release asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $asset = "nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}.exe"
          Copy-Item "crates/nanoctl-agent/target/release/${{ matrix.binary }}" $asset
          & ".\$asset" --version
          if ($LASTEXITCODE -ne 0) { throw "Release binary smoke test failed." }
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanoctl-release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}*
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: crates/nanoctl-agent
          # xcb uses quick-xml only in its build script against crate-owned protocol XML. Neither
          # vulnerable parser path nor quick-xml is present in the shipped agent runtime.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
      # Run the official CLI directly instead of the hosted Action. The Action's license/API
      # validation can fail on organization repositories because of third-party rate limits even
      # when the scanner itself reports no findings.
      - name: Scan git history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            git --redact --no-banner /repo
