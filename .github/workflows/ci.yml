name: ci

on:
  pull_request:
  push:
    branches: [master, "rewrite/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "1"

jobs:
  branch-freshness:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Require the PR head to contain the current base branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_base="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BASE_REF}" --jq '.commit.sha')"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_base}...${HEAD_SHA}" --jq '.status')"
          state=failure
          description="stale: rebase onto latest ${BASE_REF} before merging"
          if [ "$status" = ahead ] || [ "$status" = identical ]; then
            state=success
            description="contains latest ${BASE_REF}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" --method POST \
            -f state="$state" -f context=branch-freshness -f description="$description" >/dev/null
          if [ "$state" = failure ]; then
            echo "PR head compare status is '$status' against ${BASE_REF}@${current_base}." >&2
            echo "Rebase onto the latest ${BASE_REF}; merging a stale branch can silently overwrite freshly merged work." >&2
            exit 1
          fi
          echo "PR head contains ${BASE_REF}@${current_base}."
      - name: Re-mark open PR freshness after master moves
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_base="$(gh api "repos/${GITHUB_REPOSITORY}/branches/master" --jq '.commit.sha')"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .headRefOid' |
            while read -r head_sha; do
              [ -n "$head_sha" ] || continue
              if ! status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_base}...${head_sha}" --jq '.status' 2>/dev/null)"; then
                continue
              fi
              state=failure
              description="stale: rebase onto latest master before merging"
              if [ "$status" = ahead ] || [ "$status" = identical ]; then
                state=success
                description="contains latest master"
              fi
              gh api "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" --method POST \
                -f state="$state" -f context=branch-freshness -f description="$description" >/dev/null
            done
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: viewer
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun run build:viewer
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run audit

  # Every Rust leg embeds apps/viewer/dist via build.rs include_bytes!. Build it
  # once here and hand each leg the artifact instead of ~10 redundant
  # bun install + build:viewer runs.
  viewer-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Fail fast when Cargo.lock is stale (e.g. a version bump that only
      # touched Cargo.toml) before every --locked build leg fires up.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Check Cargo.lock freshness
        run: cargo metadata --locked --manifest-path crates/nanoctl-agent/Cargo.toml --format-version 1 -q
      # A version bump must update the package.json files, Cargo.toml and
      # Cargo.lock together; catch a partial bump in seconds.
      - name: Check version consistency
        run: |
          v=$(jq -r .version package.json)
          [ "$(jq -r .version apps/viewer/package.json)" = "$v" ]
          [ "$(jq -r .version packages/protocol/package.json)" = "$v" ]
          grep -qF "version = \"$v\"" crates/nanoctl-agent/Cargo.toml
          grep -qF "version = \"$v\"" crates/nanoctl-agent/Cargo.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: viewer-dist
          path: apps/viewer/dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # One leg per OS runs every Rust lint + test feature level (rtc, media, and
  # on Linux the GPL opt-in x264) in a shared target dir. This used to be ~11
  # legs — agent, agent-check, agent-media-linux/native/check, agent-x264-* —
  # each paying its own checkout, toolchain install, cache restore and apt
  # setup, and the 4-5 macOS legs alone starved the small free macOS runner
  # pool until queued legs hit GitHub's 15-minute runner-acquisition timeout
  # and the whole run was cancelled.
  agent:
    needs: viewer-dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: agent-${{ matrix.os }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Exclude build outputs from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: viewer-dist
          path: apps/viewer/dist
      - uses: ./.github/actions/linux-media-deps
        if: runner.os == 'Linux'
        with:
          cache-suffix: media-x264
          extra-packages: libx264-dev
          save-cache: ${{ github.event_name != 'pull_request' }}
      - name: Check formatting and POSIX package scripts
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path crates/nanoctl-agent/Cargo.toml -- --check
          for script in install.sh packaging/tailnet.sh packaging/linux/*.sh packaging/macos/*.sh; do sh -n "$script"; done
          shellcheck install.sh packaging/tailnet.sh packaging/linux/*.sh packaging/macos/*.sh
      - name: Validate PowerShell package scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          @(Get-Item install.ps1, packaging/tailnet.ps1) + @(Get-ChildItem packaging/windows -Filter *.ps1) | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Clippy (rtc)
        run: cargo clippy --all-targets --features rtc --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings
      - name: Clippy (media)
        run: cargo clippy --all-targets --features media --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings
      - name: Clippy (x264)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features x264 --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings
      - name: Test (rtc)
        run: cargo test --features rtc --manifest-path crates/nanoctl-agent/Cargo.toml
      - name: Test (media)
        run: cargo test --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - name: Test (x264)
        if: runner.os == 'Linux'
        run: cargo test --features x264 --manifest-path crates/nanoctl-agent/Cargo.toml

  agent-x264-package:
    # GPL opt-in only; default/release jobs deliberately do not enable this feature.
    needs: viewer-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x264-package
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: viewer-dist
          path: apps/viewer/dist
      - uses: ./.github/actions/linux-media-deps
        with:
          cache-suffix: media-x264
          extra-packages: libx264-dev
          save-cache: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --release --locked --features x264 --manifest-path crates/nanoctl-agent/Cargo.toml

  agent-media-package:
    needs: viewer-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Master release candidates own the only exact-profile release build and
    # cover all six platforms. This job keeps optimized media packaging covered
    # on PRs and non-release branches with a faster release profile (more
    # codegen units, no LTO); a single Linux leg covers the build without
    # queueing extra macOS/Windows legs behind the tiny free macOS pool.
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: media-package-ubuntu-24.04
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: viewer-dist
          path: apps/viewer/dist
      - uses: ./.github/actions/linux-media-deps
        with:
          cache-suffix: media
          save-cache: ${{ github.event_name != 'pull_request' }}
      - name: Build release media binary
        run: cargo build --release --locked --features media --manifest-path crates/nanoctl-agent/Cargo.toml

  release-candidate:
    # This is the single artifact-producing build for a master commit. The tag workflow promotes
    # these immutable artifacts instead of compiling the same commit on a second set of runners.
    needs: viewer-dist
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            architecture: arm64
            binary: nanoctl
          - runner: windows-2025
            platform: windows
            architecture: x64
            binary: nanoctl.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: viewer-dist
          path: apps/viewer/dist
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.runner }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Exclude build outputs from Defender
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - uses: ./.github/actions/linux-media-deps
        if: matrix.platform == 'linux'
        with:
          cache-suffix: media
          save-cache: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --release --locked --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - name: Stage Unix release asset
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          asset="nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}"
          install -m 0755 "crates/nanoctl-agent/target/release/${{ matrix.binary }}" "$asset"
          "./$asset" --version
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
      - name: Stage Windows release asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $asset = "nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}.exe"
          Copy-Item "crates/nanoctl-agent/target/release/${{ matrix.binary }}" $asset
          & ".\$asset" --version
          if ($LASTEXITCODE -ne 0) { throw "Release binary smoke test failed." }
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanoctl-release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}*
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit
      # xcb uses quick-xml only in its build script against crate-owned protocol XML. Neither
      # vulnerable parser path nor quick-xml is present in the shipped agent runtime.
      - name: Audit Rust dependencies
        working-directory: crates/nanoctl-agent
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      # Run the official CLI directly instead of the hosted Action. The Action's license/API
      # validation can fail on organization repositories because of third-party rate limits even
      # when the scanner itself reports no findings.
      - name: Scan git history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            git --redact --no-banner /repo
