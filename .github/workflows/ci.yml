name: ci

on:
  pull_request:
  push:
    branches: [master, "rewrite/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run audit
      - run: bun run build:sites

  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: bun run scripts/cargo.ts fmt -- --check
      - run: bun run scripts/cargo.ts clippy --all-targets --features rtc -- -D warnings
      - run: bun run scripts/cargo.ts test --features rtc
      - name: Validate POSIX package scripts
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n packaging/linux/*.sh packaging/macos/*.sh
      - name: Validate PowerShell package scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem packaging/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

  agent-media-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy
      - run: bun install --frozen-lockfile
      - name: Install native capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev \
            libva-dev libxinerama-dev libxrandr-dev libxtst-dev \
            nasm pkg-config
      - run: bun run scripts/cargo.ts clippy --all-targets --features media -- -D warnings
      - run: bun run scripts/cargo.ts test --features media
      - run: bun run scripts/cargo.ts build --release --features media

  agent-media-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy
      - run: bun install --frozen-lockfile
      - run: bun run scripts/cargo.ts clippy --all-targets --features media -- -D warnings
      - run: bun run scripts/cargo.ts test --features media
      - run: bun run scripts/cargo.ts build --release --features media

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: crates/nanoctl-agent
      - uses: gitleaks/gitleaks-action@v2
