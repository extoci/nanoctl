name: ci

on:
  pull_request:
  push:
    branches: [master, "rewrite/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "1"

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: viewer
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun run build:viewer
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run audit

  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: agent-${{ matrix.os }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Exclude build outputs from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - run: cargo test --features rtc --manifest-path crates/nanoctl-agent/Cargo.toml

  agent-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: agent-check-${{ matrix.os }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Exclude build outputs from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - run: cargo fmt --manifest-path crates/nanoctl-agent/Cargo.toml -- --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --features rtc --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings
      - name: Validate POSIX package scripts
        if: runner.os != 'Windows'
        shell: bash
        run: for script in install.sh packaging/tailnet.sh packaging/linux/*.sh packaging/macos/*.sh; do sh -n "$script"; done
      - name: Lint POSIX package scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh packaging/tailnet.sh packaging/linux/*.sh packaging/macos/*.sh
      - name: Validate PowerShell package scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          @(Get-Item install.ps1, packaging/tailnet.ps1) + @(Get-ChildItem packaging/windows -Filter *.ps1) | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

  agent-media-linux:
    # Match Linux release builds; cros-libva 0.0.12 does not compile with libva 2.23+.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: media-linux
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - name: Refresh apt index
        run: sudo apt-get update -o Acquire::Retries=10
      - name: Install native capture dependencies
        shell: bash
        run: >
          sudo apt-get install -y -o Acquire::Retries=10
          clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev libffmpeg-nvenc-dev libva-dev libxinerama-dev libxrandr-dev libxtst-dev cmake nasm pkg-config
      - run: cargo test --features media --manifest-path crates/nanoctl-agent/Cargo.toml

  agent-x264-linux:
    # GPL opt-in only; default/release jobs deliberately do not enable this feature.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x264
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - name: Refresh apt index
        run: sudo apt-get update -o Acquire::Retries=10
      - name: Install native dependencies including opt-in GPL encoder
        shell: bash
        run: >
          sudo apt-get install -y -o Acquire::Retries=10
          clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev libffmpeg-nvenc-dev libva-dev libxinerama-dev libxrandr-dev libxtst-dev libx264-dev cmake nasm pkg-config
      - run: cargo test --features x264 --manifest-path crates/nanoctl-agent/Cargo.toml

  agent-x264-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x264-check
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - name: Refresh apt index
        run: sudo apt-get update -o Acquire::Retries=10
      - name: Install native dependencies including opt-in GPL encoder
        shell: bash
        run: >
          sudo apt-get install -y -o Acquire::Retries=10
          clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev libffmpeg-nvenc-dev libva-dev libxinerama-dev libxrandr-dev libxtst-dev libx264-dev cmake nasm pkg-config
      - run: cargo clippy --all-targets --features x264 --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings

  agent-x264-package:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x264-package
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - name: Refresh apt index
        run: sudo apt-get update -o Acquire::Retries=10
      - name: Install native dependencies including opt-in GPL encoder
        shell: bash
        run: >
          sudo apt-get install -y -o Acquire::Retries=10
          clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev libffmpeg-nvenc-dev libva-dev libxinerama-dev libxrandr-dev libxtst-dev libx264-dev cmake nasm pkg-config
      - run: cargo build --release --locked --features x264 --manifest-path crates/nanoctl-agent/Cargo.toml

  agent-media-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: media-${{ matrix.os }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Exclude build outputs from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - run: cargo test --features media --manifest-path crates/nanoctl-agent/Cargo.toml

  agent-media-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: media-check-${{ matrix.os }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Exclude build outputs from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - name: Refresh apt index
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update -o Acquire::Retries=10
      - name: Install native capture dependencies
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: >
          sudo apt-get install -y -o Acquire::Retries=10
          clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev libffmpeg-nvenc-dev libva-dev libxinerama-dev libxrandr-dev libxtst-dev cmake nasm pkg-config
      - run: cargo clippy --all-targets --features media --manifest-path crates/nanoctl-agent/Cargo.toml -- -D warnings

  agent-media-package:
    # Master release candidates own the only exact-profile release build. This job keeps
    # optimized media packaging covered on PRs and non-release branches with a faster
    # release profile (more codegen units, no LTO) so it does not dominate CI time.
    if: github.event_name != 'push' || github.ref != 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: media-package-${{ matrix.os }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Exclude build outputs from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - name: Refresh apt index
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update -o Acquire::Retries=10
      - name: Install native capture dependencies
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: >
          sudo apt-get install -y -o Acquire::Retries=10
          clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev libffmpeg-nvenc-dev libva-dev libxinerama-dev libxrandr-dev libxtst-dev cmake nasm pkg-config
      - name: Build release media binary
        run: cargo build --release --locked --features media --manifest-path crates/nanoctl-agent/Cargo.toml

  release-candidate:
    # This is the single artifact-producing build for a master commit. The tag workflow promotes
    # these immutable artifacts instead of compiling the same commit on a second set of runners.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
            binary: nanoctl
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            binary: nanoctl
          - runner: macos-15-intel
            platform: macos
            architecture: x64
            binary: nanoctl
          - runner: macos-15
            platform: macos
            architecture: arm64
            binary: nanoctl
          - runner: windows-2025
            platform: windows
            architecture: x64
            binary: nanoctl.exe
          - runner: windows-11-arm
            platform: windows
            architecture: arm64
            binary: nanoctl.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.runner }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Exclude build outputs from Defender
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - name: Refresh apt index
        if: matrix.platform == 'linux'
        shell: bash
        run: sudo apt-get update -o Acquire::Retries=10
      - name: Install Linux media dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: >
          sudo apt-get install -y -o Acquire::Retries=10
          clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev libffmpeg-nvenc-dev libva-dev libxinerama-dev libxrandr-dev libxtst-dev cmake nasm pkg-config
      - run: cargo build --release --locked --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - name: Stage Unix release asset
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          asset="nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}"
          install -m 0755 "crates/nanoctl-agent/target/release/${{ matrix.binary }}" "$asset"
          "./$asset" --version
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
      - name: Stage Windows release asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $asset = "nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}.exe"
          Copy-Item "crates/nanoctl-agent/target/release/${{ matrix.binary }}" $asset
          & ".\$asset" --version
          if ($LASTEXITCODE -ne 0) { throw "Release binary smoke test failed." }
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanoctl-release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}*
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit
      # xcb uses quick-xml only in its build script against crate-owned protocol XML. Neither
      # vulnerable parser path nor quick-xml is present in the shipped agent runtime.
      - name: Audit Rust dependencies
        working-directory: crates/nanoctl-agent
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      # Run the official CLI directly instead of the hosted Action. The Action's license/API
      # validation can fail on organization repositories because of third-party rate limits even
      # when the scanner itself reports no findings.
      - name: Scan git history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            git --redact --no-banner /repo
