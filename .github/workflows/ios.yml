name: iOS prototype

on:
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [master]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Xcode 26 (iOS 26 SDK for Liquid Glass)
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')
          [ "$major" -ge 26 ] || { echo "::error::Xcode $major is too old; need 26+"; exit 1; }
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Test on an iPhone simulator
        run: |
          device=$(xcrun simctl list -j devices available | jq -er \
            '[.devices | to_entries | sort_by(.key) | reverse | .[].value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild -project Nanoctl.xcodeproj -scheme Nanoctl \
            -destination "platform=iOS Simulator,id=$device" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
