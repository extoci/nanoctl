name: latency

on:
  # Latency is a tracking metric, not a gate: run it on master and on demand so
  # PRs stop paying two extra legs (a release build + browser install each).
  push:
    branches: [master, "rewrite/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Latency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      # Shares the release-candidate cache key: this job runs the same
      # `cargo run --release --locked --features media` build, so its dependency
      # artifacts are identical and it should not recompile them from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.os }}
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Exclude build outputs from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:CARGO_HOME
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\crates\nanoctl-agent\target"
          Add-MpPreference -ExclusionProcess cargo.exe
          Add-MpPreference -ExclusionProcess rustc.exe
          Add-MpPreference -ExclusionProcess link.exe
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/linux-media-deps
        if: runner.os == 'Linux'
        with:
          cache-suffix: latency
          extra-packages: xauth xvfb
          save-cache: ${{ github.event_name != 'pull_request' }}
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: bunx playwright install chromium
      - name: Measure on Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" bun run test:latency
      - name: Measure on Windows desktop (experimental)
        id: windows
        if: runner.os == 'Windows'
        continue-on-error: true
        run: bun run test:latency
      - name: Verify latency regression evidence
        if: steps.windows.outcome != 'failure'
        shell: bash
        run: bun run evidence:latency -- test-results/*/latency.json
      - name: Summarize latency
        shell: bash
        env:
          WINDOWS_RESULT: ${{ steps.windows.outcome }}
        run: |
          if [[ "$WINDOWS_RESULT" == failure ]]; then
            echo 'No Windows latency result. See the experimental desktop step for the failure.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat test-results/*/latency.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.windows.outcome != 'failure'
        with:
          name: nanoctl-latency-${{ matrix.os }}
          path: |
            test-results/*/latency.json
            test-results/*/latency.md
          if-no-files-found: error
