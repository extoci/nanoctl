name: release candidates

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            binary: nanoctl
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            binary: nanoctl
          - platform: macos
            arch: x64
            runner: macos-15-intel
            binary: nanoctl
          - platform: macos
            arch: arm64
            runner: macos-15
            binary: nanoctl
          - platform: windows
            arch: x64
            runner: windows-2025
            binary: nanoctl.exe
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            binary: nanoctl.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - run: bun install --frozen-lockfile
      - name: Validate Unix packaging sources
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          for script in packaging/linux/*.sh packaging/macos/*.sh; do
            sh -n "$script"
          done
      - name: Validate macOS LaunchAgent
        if: matrix.platform == 'macos'
        run: plutil -lint packaging/macos/dev.nanoctl.agent.plist
      - name: Validate Windows packaging sources
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell packaging validation failed." }
      - name: Install Linux media dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev \
            libva-dev libxinerama-dev libxrandr-dev libxtst-dev nasm pkg-config
      - run: cargo build --release --locked --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - name: Record Rust toolchain identity
        id: rust-toolchain
        shell: bash
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Stage Unix package
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          install -d stage
          install -m 0755 crates/nanoctl-agent/target/release/${{ matrix.binary }} stage/
          cp LICENSE README.md stage/
          cp -R packaging/${{ matrix.platform }} stage/
      - name: Stage Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item "crates/nanoctl-agent/target/release/${{ matrix.binary }}" stage/
          Copy-Item LICENSE, README.md stage/
          Copy-Item packaging/windows stage/ -Recurse
      - name: Record candidate identity and signing requirements
        env:
          NANOCTL_RUSTC_VERSION: ${{ steps.rust-toolchain.outputs.version }}
        run: >-
          bun run scripts/write-candidate-metadata.ts
          stage
          ${{ matrix.platform }}
          ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.platform }}-${{ matrix.arch }}
          path: stage
          if-no-files-found: error
          retention-days: 14

  package:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: candidates
      - name: Create deterministic archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-packages
          epoch="$(git log -1 --format=%ct)"
          for directory in candidates/candidate-*; do
            name="${directory##*/candidate-}"
            tar \
              --sort=name \
              --mtime="@${epoch}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --format=posix \
              --pax-option=delete=atime,delete=ctime \
              -C "$directory" \
              -czf "release-packages/nanoctl-${name}.tar.gz" .
          done
          (cd release-packages && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: candidates
          format: cyclonedx-json
          output-file: release-packages/nanoctl.cdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-packages/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanoctl-release-candidates
          path: release-packages
          if-no-files-found: error
          retention-days: 30
