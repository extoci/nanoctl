name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag matches the agent version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/nanoctl-agent/Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: sh -n install.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            architecture: x64
            binary: nanoctl
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            binary: nanoctl
          - runner: macos-15-intel
            platform: macos
            architecture: x64
            binary: nanoctl
          - runner: macos-15
            platform: macos
            architecture: arm64
            binary: nanoctl
          - runner: windows-2025
            platform: windows
            architecture: x64
            binary: nanoctl.exe
          - runner: windows-11-arm
            platform: windows
            architecture: arm64
            binary: nanoctl.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.1
      - name: Install Linux media dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang libdbus-1-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxext-dev libxfixes-dev \
            libva-dev libxinerama-dev libxrandr-dev libxtst-dev nasm pkg-config
      - run: cargo build --release --locked --features media --manifest-path crates/nanoctl-agent/Cargo.toml
      - name: Stage Unix release asset
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          asset="nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}"
          install -m 0755 "crates/nanoctl-agent/target/release/${{ matrix.binary }}" "$asset"
          "./$asset" --version
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
      - name: Stage Windows release asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $asset = "nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}.exe"
          Copy-Item "crates/nanoctl-agent/target/release/${{ matrix.binary }}" $asset
          & ".\$asset" --version
          if ($LASTEXITCODE -ne 0) { throw "Release binary smoke test failed." }
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}
          path: nanoctl-${{ matrix.platform }}-${{ matrix.architecture }}*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nanoctl-*
          path: dist
          merge-multiple: true
      - name: Add installers
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
