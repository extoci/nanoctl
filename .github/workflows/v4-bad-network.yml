name: v4 bad network

on:
  pull_request:
    branches: [v4]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bad-network:
    name: ${{ matrix.sample == 1 && 'Real media at 5% loss, 25% reorder, 3 Mbps' || format('Real media at 5% loss, 25% reorder, 3 Mbps (repeat {0})', matrix.sample) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(github.head_ref == 'codex/v4-network-trial' && '[1,2,3]' || '[1]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-ubuntu-24.04
          workspaces: crates/nanoctl-agent
          save-if: ${{ github.event_name != 'pull_request' && matrix.sample == 1 }}
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/linux-media-deps
        with:
          cache-suffix: v4-bad-network
          extra-packages: xauth xvfb iproute2
          save-cache: ${{ github.event_name != 'pull_request' }}
      - run: bunx playwright install --with-deps chromium
      - name: Build the release media agent
        run: |
          bun run build:viewer
          bun run scripts/cargo.ts build --release --locked --features media
      - run: scripts/v4-bad-network.sh crates/nanoctl-agent/target/release/nanoctl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.sample == 1 && 'v4-bad-network-evidence' || format('v4-bad-network-evidence-repeat-{0}', matrix.sample) }}
          path: test-results/
          if-no-files-found: warn
