name: Nanoctl
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 149.0.0
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  Nanoctl:
    type: application
    platform: iOS
    sources: [Nanoctl]
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nanoctl.viewer
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        INFOPLIST_PREPROCESS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: NANOCTL_DEBUG=1
  NanoctlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Nanoctl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.nanoctl.viewer.tests
schemes:
  Nanoctl:
    build:
      targets:
        Nanoctl: all
    test:
      targets: [NanoctlTests]
