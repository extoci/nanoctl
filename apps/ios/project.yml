name: Nanoctl
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 158.0.0
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  Nanoctl:
    type: application
    platform: iOS
    sources: [Nanoctl]
    dependencies:
      - package: WebRTC
    postBuildScripts:
      - name: Stamp build info
        shell: /bin/sh
        script: |
          plist="$BUILT_PRODUCTS_DIR/$INFOPLIST_PATH"
          [ -f "$plist" ] || exit 0
          cd "$SRCROOT/../.." 2>/dev/null || exit 0
          commit=$(git rev-parse HEAD 2>/dev/null) || exit 0
          git diff --quiet 2>/dev/null || commit="$commit-dirty"
          /usr/libexec/PlistBuddy -c "Add NanoctlCommit string $commit" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set NanoctlCommit $commit" "$plist"
          /usr/libexec/PlistBuddy -c "Add NanoctlBuiltAt string $(date '+%b %-d %H:%M')" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set NanoctlBuiltAt $(date '+%b %-d %H:%M')" "$plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nanoctl.viewer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        INFOPLIST_PREPROCESS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: NANOCTL_DEBUG=1
  NanoctlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Nanoctl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.nanoctl.viewer.tests
schemes:
  Nanoctl:
    build:
      targets:
        Nanoctl: all
    test:
      targets: [NanoctlTests]
