[package]
name = "nanoctl-agent"
version = "3.0.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Headless nanoctl remote desktop agent"

[features]
default = []
capture = [
  "dep:apple-cf",
  "dep:fast_image_resize",
  "dep:cros-codecs",
  "dep:cros-libva",
  "dep:openh264",
  "dep:videotoolbox",
  "dep:windows",
  "dep:xcap",
]
media = ["capture", "dep:enigo", "dep:rtcp", "dep:x11rb", "dep:xkeysym", "rtc"]
rtc = ["dep:interceptor", "dep:webrtc"]

[[bin]]
name = "nanoctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = "3.0"
enigo = { version = "0.6.1", optional = true }
futures-util = "=0.3.32"
hostname = "0.4"
interceptor = { version = "0.17.1", optional = true }
nanoctl-update = { path = "../nanoctl-update" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls-no-provider",
  "http2",
] }
rtcp = { version = "0.17.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.11"
tokio = { version = "1.49", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
  "net",
  "process",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", default-features = false, features = ["v4"] }
openh264 = { version = "0.9.7", optional = true }
webrtc = { version = "0.17.1", optional = true }
xcap = { version = "0.9.7", features = ["wgc"], optional = true }
x509-parser = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xkb", "xtest"], optional = true }
xkeysym = { version = "0.2", optional = true }
cros-codecs = { version = "0.0.6", features = ["vaapi"], optional = true }
cros-libva = { version = "0.0.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-cf = { version = "0.9.3", optional = true }
videotoolbox = { version = "0.18.1", default-features = false, features = [
  "compression",
], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
fast_image_resize = { version = "6.2", default-features = false, features = [
  "std",
  "only_u8x4",
], optional = true }
windows = { version = "0.62.2", features = [
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
], optional = true }

[dev-dependencies]
proptest = "1.11.0"
rcgen = "0.13"
tempfile = "3.24"
tokio-tungstenite = "0.29"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
