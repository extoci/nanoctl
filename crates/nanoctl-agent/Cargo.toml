[package]
name = "nanoctl-agent"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Headless nanoctl remote desktop agent"

[features]
default = []
capture = ["dep:openh264", "dep:xcap"]
media = ["capture", "dep:enigo", "rtc"]
rtc = ["dep:webrtc"]

[[bin]]
name = "nanoctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
enigo = { version = "0.6.1", optional = true }
futures-util = "=0.3.32"
hostname = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
openh264 = { version = "0.9.7", optional = true }
webrtc = { version = "0.14.0", optional = true }
xcap = { version = "0.9.7", optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.24"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
