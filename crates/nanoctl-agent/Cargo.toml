[package]
name = "nanoctl-agent"
version = "3.0.0-alpha.24"
edition = "2024"
license = "MIT"
description = "Headless nanoctl remote desktop agent"

[features]
default = []
capture = [
  "dep:apple-cf",
  "dep:fast_image_resize",
  "dep:block2",
  "dep:dispatch2",
  "dep:objc2",
  "dep:objc2-core-graphics",
  "dep:objc2-core-media",
  "dep:objc2-core-video",
  "dep:objc2-foundation",
  "dep:objc2-screen-capture-kit",
  "dep:cros-codecs",
  "dep:cros-libva",
  "dep:openh264",
  "dep:openh264-sys2",
  "dep:videotoolbox",
  "dep:windows",
  "dep:xcap",
  "dep:xcb",
  "dep:libc",
]
media = [
  "capture",
  "dep:libloading",
  "dep:arboard",
  "dep:cpal",
  "dep:enigo",
  "dep:opus",
  "dep:rtcp",
  "dep:vigem-client",
  "dep:x11rb",
  "dep:xkeysym",
  "rtc",
]
rtc = ["dep:interceptor", "dep:webrtc", "dep:bytes"]
x264 = ["media", "dep:pkg-config"]

[[bin]]
name = "nanoctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", optional = true }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
async-trait = "0.1"
base64 = "0.22"
bytes = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = "3.0"
enigo = { version = "0.6.1", optional = true }
futures-util = "=0.3.32"
hostname = "0.4"
interceptor = { version = "0.17.1", optional = true }
nanoctl-update = { path = "../nanoctl-update" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls-no-provider",
  "http2",
] }
rtcp = { version = "0.17.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.11"
tokio = { version = "1.49", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
  "net",
  "process",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", default-features = false, features = ["v4"] }
openh264 = { version = "0.9.7", optional = true }
openh264-sys2 = { version = "0.9.7", optional = true }
opus = { version = "0.4", optional = true }
webrtc = { version = "0.17.1", optional = true }
xcap = { version = "0.9.7", features = ["wgc"], optional = true }
x509-parser = "0.16"
yuv = "0.8.21"

[target.'cfg(target_os = "linux")'.dependencies]
xcb = { version = "1.7", features = ["damage", "randr"], optional = true }
libc = { version = "0.2", optional = true }
x11rb = { version = "0.13", features = ["xkb", "xtest"], optional = true }
xkeysym = { version = "0.2", optional = true }
cros-codecs = { version = "0.0.6", features = ["vaapi"], optional = true }
cros-libva = { version = "0.0.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-cf = { version = "0.9.3", optional = true }
block2 = { version = "0.6.2", optional = true }
dispatch2 = { version = "0.3.1", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "CGDirectDisplay",
], optional = true }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
  "CMSampleBuffer",
  "CMTime",
  "objc2-core-video",
], optional = true }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
  "CVPixelBuffer",
  "CVReturn",
], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSString",
  "NSValue",
], optional = true }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
  "SCShareableContent",
  "SCStream",
  "block2",
  "dispatch2",
  "objc2-core-graphics",
  "objc2-core-media",
], optional = true }
videotoolbox = { version = "0.18.1", default-features = false, features = [
  "compression",
], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = { version = "0.8", optional = true }
anstyle-query = "1.1.5"
cpal = { version = "0.16", optional = true }
fast_image_resize = { version = "6.2", default-features = false, features = [
  "std",
  "only_u8x4",
], optional = true }
vigem-client = { version = "0.1.4", features = ["unstable_ds4"], optional = true }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_NetworkManagement_WiFi",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
], optional = true }

[build-dependencies]
cc = "1.2"
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
proptest = "1.11.0"
rcgen = "0.13"
tempfile = "3.24"
tokio-tungstenite = "0.29"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "symbols"
