[package]
name = "nanoctl-media"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Clean-slate nanoctl bounded capture-encode-send media pipeline"

[features]
default = []
capture = ["dep:xcap"]

[dependencies]
async-trait = "0.1"
rayon = "1.11"
nanoctl-core = { path = "../nanoctl-core" }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "time"] }
xcap = { version = "0.9.7", features = ["wgc"], optional = true }
yuv = "0.8.21"
openh264 = "0.9.7"
openh264-sys2 = "0.9.7"

[dev-dependencies]
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
anyhow = "1.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }
