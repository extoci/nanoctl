[package]
name = "nanoctl-planck"
version = "3.0.0-alpha.5"
edition = "2024"
license = "MIT"
description = "nanoctl desktop client shell (planck)"

[[bin]]
name = "nanoctl-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
directories = "6.0"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.24"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "symbols"
