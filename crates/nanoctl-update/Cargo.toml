[package]
name = "nanoctl-update"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Exact-byte signed update manifest verifier for nanoctl"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = "3.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
