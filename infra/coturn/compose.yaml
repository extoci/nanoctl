services:
  turn:
    build:
      context: .
    image: nanoctl/coturn:4.14.0-r0
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=0700,uid=65534,gid=65534
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      TURN_REALM: ${TURN_REALM:?set TURN_REALM}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP}
      TURN_LISTEN_IP: ${TURN_LISTEN_IP:?set TURN_LISTEN_IP}
      TURN_RELAY_IP: ${TURN_RELAY_IP:?set TURN_RELAY_IP}
      TURN_TLS_ENABLED: ${TURN_TLS_ENABLED:-1}
    secrets:
      - turn_auth_secret
      - turn_fullchain.pem
      - turn_privkey.pem
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", 'turnutils_stunclient -p 3478 "$${TURN_LISTEN_IP}"']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  turn_auth_secret:
    file: ./secrets/turn_auth_secret
  turn_fullchain.pem:
    file: ./secrets/turn_fullchain.pem
  turn_privkey.pem:
    file: ./secrets/turn_privkey.pem
