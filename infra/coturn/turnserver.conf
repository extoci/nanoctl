# Static production baseline. The entrypoint appends deployment-specific realm, address, TLS, and
# REST-secret values to a private configuration file in tmpfs.
fingerprint
use-auth-secret

listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Do not relay to local/special networks.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

stale-nonce=600
max-bps=100000000
total-quota=1200
user-quota=12
no-software-attribute
prometheus
prometheus-port=9641
prometheus-address=127.0.0.1
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
