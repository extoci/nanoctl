# Reference production baseline. Substitute deployment-specific values through the secret manager.
fingerprint
use-auth-secret
static-auth-secret=REPLACE_FROM_SECRET_MANAGER
realm=turn.nanoctl.example

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49260

# TLS paths are mounted read-only by the deployment.
cert=/run/secrets/turn_fullchain.pem
pkey=/run/secrets/turn_privkey.pem
no-tlsv1
no-tlsv1_1

# Do not relay to local/special networks.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

stale-nonce=600
max-bps=100000000
total-quota=1200
user-quota=12
no-cli
no-software-attribute
log-file=stdout
simple-log
